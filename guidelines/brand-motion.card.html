<!-- @dsCard group="Brand" viewport="700x160" name="Motion and states" subtitle="Hover and focus only, plus one scroll-reveal" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}button:hover{background:var(--fill-primary-hover)!important;box-shadow:var(--shadow-1)}.sec:hover{background:var(--bg-subtle)!important}</style></head><body>
<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
  <button style="font:inherit;font-size:15px;font-weight:700;padding:12px 24px;border-radius:999px;background:var(--fill-primary);color:var(--on-primary);border:1px solid var(--fill-primary-edge);cursor:pointer;transition:background-color 120ms cubic-bezier(.2,0,.2,1),box-shadow 120ms cubic-bezier(.2,0,.2,1)">Hover me</button>
  <button class="sec" style="font:inherit;font-size:15px;font-weight:700;padding:12px 24px;border-radius:999px;background:transparent;color:var(--text-color);border:1px solid var(--border-strong);cursor:pointer;transition:background-color 120ms cubic-bezier(.2,0,.2,1)">And me</button>
  <button style="font:inherit;font-size:15px;font-weight:700;padding:12px 24px;border-radius:999px;background:transparent;color:var(--text-color);border:1px solid var(--border-strong);outline:2px solid var(--border-strong);outline-offset:2px">Focus ring</button>
  <div style="font-size:12px;font-family:var(--font-mono);color:var(--text-muted);line-height:1.7">120ms / 200ms<br>cubic-bezier(.2,0,.2,1)<br>no transform, ever</div>
</div>
</body></html>
