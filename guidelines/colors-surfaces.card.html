<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces" subtitle="Warm neutrals only — no cool grey anywhere" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="display:grid;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border)"></div><div style="font-size:12px;font-weight:700;letter-spacing:.02em">--bg</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#FFFFFF</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--bg-subtle);border:1px solid var(--border)"></div><div style="font-size:12px;font-weight:700;letter-spacing:.02em">--bg-subtle</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#FFFBF0</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--bg-sunken);border:1px solid var(--border)"></div><div style="font-size:12px;font-weight:700;letter-spacing:.02em">--bg-sunken</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">#FDF4E0</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--surface-accent);border:1px solid var(--border)"></div><div style="font-size:12px;font-weight:700;letter-spacing:.02em">--surface-accent</div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">vanilla</div></div></div>
</body></html>
