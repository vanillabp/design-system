<!-- @dsCard group="Colors" viewport="700x180" name="Release red" subtitle="The one hue outside the palette — “new in this version”, nothing else" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
  <span style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--fill-release);color:var(--on-release);padding:6px 14px;border-radius:var(--radius-pill)">New in 2.0</span>
  <div style="display:grid;gap:6px">
    <div style="height:40px;width:120px;border-radius:var(--radius-sm);background:var(--fill-release)"></div>
    <code style="font-size:11px;color:var(--text-muted)">--fill-release · #A3231A</code>
  </div>
  <div style="font-size:12px;color:var(--text-muted);line-height:1.6;max-width:34ch">
    6.09:1 with white text. <strong style="color:var(--text-color)">Not</strong> a danger colour — this system has no error state — and not a highlight. Two or three uses per surface.
  </div>
</div>
</body></html>
