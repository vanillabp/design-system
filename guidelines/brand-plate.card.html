<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center">
  <div style="background:var(--surface-accent);border-radius:var(--radius-lg);padding:18px;display:grid;place-items:center">
    <img src="../assets/illustrations/hex.jpg" alt="" style="max-width:100%;height:auto;display:block;border-radius:var(--radius-md)">
  </div>
  <div style="font-size:13px;color:var(--text-muted);line-height:1.6">Photography and illustration in this system are warm and flat — no cool casts, no grain, no gradient overlays. The vanilla plate is what stops an image reading as clip-art dropped onto white.</div>
