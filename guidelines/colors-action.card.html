<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
  <button style="font:inherit;font-size:15px;font-weight:700;letter-spacing:.01em;padding:12px 24px;border-radius:999px;background:var(--fill-primary);color:var(--on-primary);border:1px solid var(--fill-primary-edge);cursor:pointer">See the adapters</button>
  <button style="font:inherit;font-size:15px;font-weight:700;letter-spacing:.01em;padding:12px 24px;border-radius:999px;background:var(--fill-primary-hover);color:var(--on-primary);border:1px solid var(--fill-primary-edge);cursor:pointer;box-shadow:var(--shadow-1)">Hover</button>
  <div style="font-size:12px;color:var(--text-muted);line-height:1.6;font-family:var(--font-mono)">
    fill #FFC000 · label 6.28:1<br>edge #806000 — amber alone is 1.64:1 on white<br>and would fail WCAG 1.4.11
  </div>
</div>
</body></html>
