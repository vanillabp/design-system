<!-- @dsCard group="Spacing" viewport="700x230" name="Rhythm in use" subtitle="Space encodes grouping, not mere separation" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:grid;gap:6px">
  <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)">Eyebrow</div>
  <div style="font-size:11px;font-family:var(--font-mono);color:var(--text-subtle)">↕ --space-4 · 16px</div>
  <div style="font-size:26px;font-weight:700;letter-spacing:-.025em;color:var(--text-color)">Heading</div>
  <div style="font-size:11px;font-family:var(--font-mono);color:var(--text-subtle)">↕ --space-5 · 24px</div>
  <div style="font-size:17px;color:var(--text-muted);line-height:1.65">Related elements are never further apart than --space-5.</div>
  <div style="font-size:11px;font-family:var(--font-mono);color:var(--text-subtle);border-top:2px solid var(--accent-graphic);padding-top:8px;margin-top:8px">↕ --space-12 / --space-16 between sections</div>
</div>
</body></html>
