<!-- @dsCard group="Colors" viewport="700x180" name="Dark mode" subtitle="Roles invert; the palette does not change" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="background:#181106;border-radius:var(--radius-lg);padding:20px 22px;display:grid;gap:14px">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
    <div><div style="height:40px;border-radius:6px;background:#181106;border:1px solid #3A2A10"></div><div style="font-size:11px;color:#C9BFB0;font-family:var(--font-mono);margin-top:5px">--bg</div></div><div><div style="height:40px;border-radius:6px;background:#211608;border:1px solid #3A2A10"></div><div style="font-size:11px;color:#C9BFB0;font-family:var(--font-mono);margin-top:5px">--bg-subtle</div></div><div><div style="height:40px;border-radius:6px;background:#663300;border:1px solid #3A2A10"></div><div style="font-size:11px;color:#C9BFB0;font-family:var(--font-mono);margin-top:5px">--surface-accent</div></div><div><div style="height:40px;border-radius:6px;background:#3A2A10;border:1px solid #3A2A10"></div><div style="font-size:11px;color:#C9BFB0;font-family:var(--font-mono);margin-top:5px">--border</div></div>
  </div>
  <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <span style="color:#FFF8EB;font-size:16px;font-weight:700">Text #FFF8EB — 17.72:1</span>
    <span style="color:#FFC000;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Accent</span>
    <button style="font:inherit;font-size:14px;font-weight:700;padding:9px 20px;border-radius:999px;background:#FFC000;color:#663300;border:1px solid transparent">Buttons do not flip</button>
  </div>
</div>
</body></html>
