<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:flex;gap:22px;align-items:center">
  <div style="width:200px;height:96px;border-radius:var(--radius-lg);background:var(--bg);border:1px solid var(--border);box-shadow:var(--shadow-1);display:grid;place-items:center;font-size:12px;font-family:var(--font-mono);color:var(--accent-text)">--shadow-1</div>
  <div style="width:200px;height:96px;border-radius:var(--radius-lg);background:var(--bg);border:1px solid var(--border);box-shadow:var(--shadow-2);display:grid;place-items:center;font-size:12px;font-family:var(--font-mono);color:var(--accent-text)">--shadow-2</div>
  <div style="font-size:12px;color:var(--text-muted);line-height:1.6;max-width:20ch">In dark mode both resolve to <code style="font-size:11px">none</code> — hairlines carry the edge instead.</div>
</div>
</body></html>
