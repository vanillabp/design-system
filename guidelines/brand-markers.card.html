<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:flex;gap:34px;align-items:center">
<div style="display:grid;gap:8px;justify-items:center"><svg width="32" height="32" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="var(--accent-graphic)" stroke-width="2"/></svg><div style="font-size:11px;font-family:var(--font-mono);color:var(--accent-text)">start</div><div style="font-size:11px;color:var(--text-muted)">Opening section</div></div><div style="display:grid;gap:8px;justify-items:center"><svg width="32" height="32" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="3" fill="none" stroke="var(--accent-graphic)" stroke-width="2"/></svg><div style="font-size:11px;font-family:var(--font-mono);color:var(--accent-text)">task</div><div style="font-size:11px;color:var(--text-muted)">Body sections</div></div><div style="display:grid;gap:8px;justify-items:center"><svg width="32" height="32" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="var(--accent-graphic)" stroke-width="3.5"/></svg><div style="font-size:11px;font-family:var(--font-mono);color:var(--accent-text)">end</div><div style="font-size:11px;color:var(--text-muted)">Last section</div></div>
