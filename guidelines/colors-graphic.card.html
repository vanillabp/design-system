<!-- @dsCard group="Colors" viewport="700x190" name="Gold is graphic" subtitle="Gold and amber never carry text — that is what keeps them bright" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center">
  <div style="display:grid;gap:12px">
    <hr style="border:0;border-top:2px solid var(--accent-graphic);margin:0">
    <div style="display:flex;gap:10px;align-items:center">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="var(--accent-graphic)" stroke-width="2"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="3" fill="none" stroke="var(--accent-graphic)" stroke-width="2"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="var(--accent-graphic)" stroke-width="3.5"/></svg>
      <code style="font-size:11px;color:var(--text-muted)">--accent-graphic</code>
    </div>
    <div style="height:28px;border-radius:var(--radius-sm);background:var(--accent-graphic-bright)"></div>
  </div>
  <div style="display:grid;gap:8px;font-size:13px;color:var(--text-muted);line-height:1.5">
    <div><strong style="color:var(--text-color)">Allowed:</strong> fills, borders, icons, rules, illustrations.</div>
    <div><strong style="color:var(--text-color)">Never:</strong> body text, headings, links, labels.</div>
    <div style="font-family:var(--font-mono);font-size:11px">brown on gold 3.53:1 · white on gold 2.91:1 — both fail</div>
  </div>
</div>
</body></html>
